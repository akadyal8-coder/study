<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#7a62c9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="A+"><title>رحلتي نحو A+</title>
<style>
:root{--bg:#fbf7f0;--card:#fffdf9;--ink:#2e2a3b;--mut:#7b7589;--lav:#cfc3f0;--pink:#f6cfdc;--blue:#c6dcf3;--sage:#cfe3d0;--peach:#f9d9c2;--acc:#7a62c9;--line:#ece4f3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1a26;--card:#262335;--ink:#f1edf8;--mut:#a9a2bd;--lav:#4a3f78;--pink:#5a3a4a;--blue:#34506b;--sage:#3b5440;--peach:#6a4a38;--acc:#b9a6ff;--line:#383350;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;line-height:1.6;padding-bottom:84px}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2rem 0 .8rem}h2{font-size:1.1rem;margin:0 0 .6rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(122,98,201,.08)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
button,.btn{font:inherit;min-height:48px;padding:0 18px;border:0;border-radius:16px;background:var(--lav);color:var(--ink);font-weight:600;cursor:pointer}
button.p{background:var(--acc);color:#fff}button.g{background:var(--sage)}button.k{background:var(--pink)}button.o{background:var(--peach)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;min-height:46px;padding:8px 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 3px}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}
.big{font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.mut{color:var(--mut);font-size:.9rem}
nav{overflow-x:auto;position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;min-width:76px;background:none;min-height:52px;color:var(--mut);padding:0 4px}nav button.on{color:var(--acc);background:var(--lav)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:8px}
.day{flex-wrap:wrap;gap:6px;display:flex;justify-content:space-between;padding:8px 10px;border-radius:12px;margin-bottom:4px;background:var(--bg)}
.day.now{outline:2px solid var(--acc)}.day.past{opacity:.6}
.warn{background:var(--peach);border-radius:14px;padding:10px 12px;margin:8px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px}
#modal div{background:var(--card);border-radius:22px;padding:20px;max-width:420px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .5s}}
@media(min-width:1000px){main{max-width:960px;padding:28px}nav{max-width:960px;margin:auto;border-radius:20px 20px 0 0}} details{padding:10px 0;border-bottom:1px solid var(--line)} textarea{min-height:110px} a{color:var(--acc)} nav{z-index:5} #modal{z-index:20}

:root[data-theme=dark]{--bg:#1c1a26;--card:#262335;--ink:#f1edf8;--mut:#bcb4cc;--lav:#4a3f78;--pink:#5a3a4a;--blue:#34506b;--sage:#3b5440;--peach:#6a4a38;--acc:#b9a6ff;--line:#383350;color-scheme:dark}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;padding:14px 0;border-bottom:1px solid var(--line)}.brand strong{font-size:1.25rem;letter-spacing:-.04em}.brand small{display:block;color:var(--mut)}.brand button{min-height:44px;font-size:.85rem}.card{box-shadow:0 4px 16px #74639a0b}button.p{background:#6952ad;color:white}button:disabled{opacity:.55;cursor:not-allowed}nav button{white-space:nowrap}#modal>div{max-height:85vh;overflow:auto;width:100%}textarea{resize:vertical}h1{font-size:1.65rem}h2{font-size:1.15rem}
@media(min-width:900px){body{padding-bottom:0;padding-inline-start:190px}main{max-width:1050px;padding:28px}nav{inset:0 0 0 auto;width:190px;max-width:none;flex-direction:column;justify-content:flex-start;gap:5px;padding:24px 12px;border-radius:0;border-inline-end:1px solid var(--line);overflow-y:auto}nav button{flex:0 0 auto;text-align:start;padding-inline:14px}#upd{bottom:12px!important;inset-inline-start:200px!important}}
@media print{nav,.brand button,button,#upd{display:none!important}body{padding:0;background:white;color:black}main{max-width:none}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<main><header class="brand"><div><strong>StudyFlow AI</strong><small>رحلتي نحو A+ · Journey to A+</small></div><button id="themeBtn" onclick="cycleTheme()" aria-label="تغيير المظهر">المظهر</button></header><section id="app"></section></main>
<div id="upd" class="warn" style="display:none;position:fixed;inset-inline:8px;bottom:78px;z-index:9"></div><nav id="nav"></nav>
<div id="modal"><div><p id="mt"></p><div class="row"><button class="p" id="my">تأكيد</button><button id="mn">إلغاء</button></div></div></div>
<script>
const COL=['#cfc3f0','#f6cfdc','#c6dcf3','#cfe3d0','#f9d9c2','#e8dcb8','#d3d3e8','#f2c9c9'];
const KEY='studyflow_v1';let S,tab='today',P=null,msg='';
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{camp:null,subjects:[],plan:[],sessions:[],timer:null};
const mig=()=>{S.extra=S.extra||{reflection:{},gpa:[],energy:"medium",aiNotes:[],locks:[]};S.rw=S.rw||[15,20,25,10,10,10,10];S.tasks=S.tasks||[];S.mist=S.mist||[];S.grades=S.grades||[];S.target=S.target||90;S.arch=S.arch||[];S.exams=S.exams||[];S.run=S.run||null;S.cards=S.cards||[];S.cr=S.cr||null;S.exams.forEach(e=>{e.att=e.att||[];e.att.forEach(a=>{a.man=a.man||{}})});const RM={'فهم خاطئ':'und','خطأ حفظ':'mem','قراءة السؤال':'read','تطبيق':'app','خلط مفاهيم':'mix'},T0=new Date().toISOString().slice(0,10);S.mist.forEach(m=>{if(m.cnt===undefined)Object.assign(m,{cnt:1,d:T0,rsn:RM[m.c]||'other',wa:'',exp:'',srcn:'',pg:'',lec:'',note:'',rn:0,ru:'',src:m.src||'manual:'+m.id})});S.subjects.forEach(s=>(s.lecs||[]).forEach(l=>{if(l.u===undefined)l.u=null}));S.subjects.forEach(s=>{s.lecs=s.lecs||[];s.lecs.forEach(l=>{if(!l.sg)l.sg=[l.st>=2,l.st>=3,l.st>=4,l.st>=5,l.st>=6]})});S.grades.forEach(g=>{if(!g.sid&&S.subjects[0])g.sid=S.subjects[0].id})};mig();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){msg='تعذر الحفظ: مساحة المتصفح ممتلئة أو ممنوعة'}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ds(new Date());
const dl=(s,n)=>{const a=[],d=new Date(s+'T00:00:00');for(let i=0;i<n;i++){a.push(ds(d));d.setDate(d.getDate()+1)}return a};
const ask=(t,cb)=>{mt.textContent=t;modal.style.display='flex';my.onclick=()=>{modal.style.display='none';cb()};mn.onclick=()=>{modal.style.display='none';render()}};
const sub=id=>S.subjects.find(s=>s.id===id);
const prog=s=>s.pages?Math.min(1,s.done/s.pages):0;
const hrs=d=>S.sessions.filter(x=>x.date===d).reduce((a,x)=>a+x.mins,0)/60;
// ---- scheduling engine ----
function alloc(ws,total){const k=ws.length,rest=total-k;if(rest<=0)return ws.map(()=>1);const sum=ws.reduce((a,b)=>a+b,0)||1,q=ws.map(w=>w/sum*rest),f=q.map(Math.floor);let left=rest-f.reduce((a,b)=>a+b,0);q.map((v,i)=>[v-f[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,left).forEach(([,i])=>f[i]++);return f.map(v=>v+1)}
function build(dates,subs,wf){const n=dates.length,warn=[];if(!subs.length||!n)return{plan:[],warn:['لا توجد مواد أو أيام متاحة']};
 const order=[...subs].sort((a,b)=>(a.exam||'9')>(b.exam||'9')?1:-1);
 const R=n>=order.length*1.5?Math.max(1,Math.round(n*.15)):0,sd=n-R;let use=order;
 if(sd<order.length){use=order.slice(0,sd);warn.push(`الأيام (${n}) أقل من عدد المواد (${order.length}). لم تدخل ${order.length-sd} مادة في الخطة. زد الأيام أو ادمج مواد.`)}
 const a=alloc(use.map(wf),sd),plan=[];let i=0;
 use.forEach((s,k)=>{for(let j=0;j<a[k];j++)plan.push({date:dates[i++],sid:s.id,type:'study'})});
 for(let j=0;j<R;j++)plan.push({date:dates[i++],sid:use[j%use.length].id,type:'rev'});
 use.forEach(s=>{if(s.exam){const last=plan.filter(p=>p.sid===s.id&&p.type==='study').pop();if(last&&last.date>=s.exam)warn.push(`مادة «${s.name}» تنتهي دراستها بعد أو في يوم اختبارها (${s.exam}).`)}});
 const need=subs.reduce((a,s)=>a+wAll(s),0)/60,cap=n*(S.camp?S.camp.hours:12)*.5;if(need>cap)warn.push(`الوقت المقدر للتعلم (${need.toFixed(0)} ساعة) أكبر من سعة التعلم المتاحة (${cap.toFixed(0)} ساعة). قلل المحتوى أو زد الأيام أو الساعات.`);const h=S.camp?S.camp.hours:12;if(h>12)warn.push('الهدف اليومي أكثر من 12 ساعة، وقد لا يكون واقعيا.');
 return{plan,warn}}
const mpp=s=>{const b=[2,3,4][s.diff-1]||3,tm=S.sessions.filter(x=>x.sid===s.id).reduce((a,x)=>a+x.mins,0);return s.done>=10&&tm>0?(b+tm/s.done)/2:b};
const wAll=s=>Math.max(1,s.pages-(s.done||0))*mpp(s)*(1+(s.lecs&&s.lecs.length?(1-mast(s))*.2:0));
// ---- timer ----
const el=t=>t?Math.max(0,Math.min(t.goal||Infinity,t.acc+(t.run?Date.now()-t.at:0))):0;
const fmt=ms=>{const s=Math.floor(ms/1000);return[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(v=>String(v).padStart(2,'0')).join(':')};
function tStart(){if(busy())return;const sid=document.getElementById('tsub').value;if(!sid){msg='أضف مادة أولا';return render()}
 S.timer={sid,act:document.getElementById('tact').value,start:Date.now(),at:Date.now(),acc:0,segments:[],run:true};save();render()}
function timerSegments(t,now=Date.now()){const seg=(t.segments||[]).slice();if(t.run)seg.push([t.at,now]);return seg}
function splitSegments(seg,limit=Infinity){const out={};let left=limit;for(const [a,b] of seg){let x=a,end=Math.min(b,a+left);while(x<end){const next=new Date(x);next.setHours(24,0,0,0);const y=Math.min(end,+next),d=ds(new Date(x));out[d]=(out[d]||0)+y-x;left-=y-x;x=y}if(left<=0)break}return out}
function tPause(){const t=S.timer;if(!t)return;if(t.run){const now=Date.now();if(!t.segments&&t.acc===0)t.segments=[];if(t.segments)t.segments.push([t.at,now]);t.acc+=now-t.at;t.run=false}else{t.at=Date.now();t.run=true}save();render()}
function tFinish(){const t=S.timer;if(!t)return;const ms=el(t),now=Date.now();const parts=t.segments||t.acc===0?splitSegments(timerSegments(t,now),ms):{[ds(new Date(t.start))]:ms};for(const [date,m] of Object.entries(parts))S.sessions.push({sid:t.sid,act:t.act,date,start:t.start,end:now,mins:m/60000});S.timer=null;if(t.pomo&&ms>=t.goal){extras().pomoBreak={sid:t.sid,until:now+t.pomo*60000};msg='انتهت جلسة التركيز؛ حان وقت الاستراحة'}else msg='تم حفظ الجلسة';save();render()}
function tCancel(){ask('إلغاء الجلسة الحالية دون حفظ؟',()=>{S.timer=null;save();render()})}
function manual(){const m=+document.getElementById('mm').value;if(!(m>0))return;S.sessions.push({sid:document.getElementById('tsub').value,act:'manual',date:today(),start:Date.now(),end:Date.now(),mins:m});save();msg='تمت إضافة '+m+' دقيقة';render()}
setInterval(()=>{const e=document.getElementById('tclk');if(S.timer&&S.timer.goal&&el(S.timer)>=S.timer.goal){tFinish();return}if(e&&S.timer)e.textContent=fmt(S.timer.goal?S.timer.goal-el(S.timer):el(S.timer))},500);
// ---- actions ----
function preview(){const g=id=>document.getElementById(id).value;const days=+g('f_days'),h=+g('f_h');
 const subs=g('f_subs').split('\n').map(l=>l.trim()).filter(Boolean).map((l,i)=>{const p=l.split(/[|،,]/).map(x=>x.trim());return{id:'s'+Date.now()+i,name:p[0],pages:+p[1]||0,diff:Math.min(3,Math.max(1,+p[2]||2)),exam:p[3]||'',done:0,color:COL[i%COL.length]}});
 if(!g('f_start')||!Number.isInteger(days)||days<1||days>365||!Number.isFinite(h)||h<1||h>16||!subs.length||subs.some(s=>!s.name||!Number.isInteger(s.pages)||s.pages<0||s.pages>100000||!Number.isInteger(s.diff)|| (s.exam&&!/^\d{4}-\d{2}-\d{2}$/.test(s.exam)))){msg='املأ تاريخ البداية وعدد الأيام والساعات والمواد';return render()}
 const r=build(dl(g('f_start'),days),subs,wAll);P={camp:{name:g('f_name')||'حملتي',start:g('f_start'),days,hours:h},subs,...r};msg='';render()}
function commit(){S.camp=P.camp;S.subjects=P.subs;S.subjects.forEach(s=>s.lecs=[]);S.plan=P.plan;S.sessions=[];S.timer=null;P=null;tab='today';save();render()}
function addPages(id){const v=+document.getElementById('pg'+id).value,s=sub(id);if(!(v>0))return;s.done=Math.min(s.pages,s.done+v);save();render()}
function rescue(nd){const t=today(),nd2=nd||S.camp.days,dates=dl(S.camp.start,nd2).filter(d=>d>=t);
 const subs=S.subjects.filter(s=>prog(s)<1);if(!dates.length||!subs.length){msg='لا يوجد ما يحتاج إنقاذا';return render()}
 const r=build(dates,subs,wAll),lost=keepEx(S.plan.filter(p=>p.date>=t),r.plan);
 if(lost.length){msg='تعذر الحفاظ على '+lost.length+' اختبار مجدول؛ لم تتغير الخطة. عدّل السعة أو المواعيد.';return render()}
 ask(`سيعاد توزيع ${dates.length} يوم متبق على ${subs.length} مادة. الأيام الماضية والجلسات المسجلة تبقى كما هي. تطبيق؟${r.warn.length?' تنبيه: '+r.warn[0]:''}`,()=>{S.camp.days=nd2;S.plan=S.plan.filter(p=>p.date<t).concat(r.plan);save();msg='تم تحديث الخطة';render()})}
function whatNow(){const t=today(),p=S.plan.find(x=>x.date===t);const late=S.plan.filter(x=>x.date<t&&x.type==='study'&&prog(sub(x.sid)||{pages:0,done:0})<1).length;
 const open=S.subjects.filter(s=>prog(s)<1).sort((a,b)=>(a.exam||'9')>(b.exam||'9')?1:-1);
 if(!p&&!open.length)return'لا توجد مهام مفتوحة. راجع مواد أنهيتها.';
 const s=p?sub(p.sid):open[0];let why=p?(p.type==='rev'?'اليوم يوم مراجعة في خطتك':'هذه مادة اليوم في خطتك'):'لا يوجد يوم مخصص لك اليوم، وهذه أقرب مادة اختبارا';
 if(p&&p.type==='rev'){const w=[...S.subjects].sort((a,b)=>prog(a)-prog(b))[0];return`ابدأ بمراجعة «${w.name}» لأنها الأقل تقدما (${Math.round(prog(w)*100)}%).`}
 return`ابدأ بـ «${s.name}». السبب: ${why}${s.exam?'، واختبارها '+s.exam:''}${late?`. تنبيه: عندك ${late} يوم دراسة متأخر، فكر في «إنقاذ خطتي».`:''}`}
function exportB(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='studyflow-backup-'+today()+'.json';a.click()}
function validateBackup(d){if(!d||typeof d!=='object'||!Array.isArray(d.subjects)||!Array.isArray(d.plan)||!Array.isArray(d.sessions))throw Error('structure');const id=x=>typeof x==='string'&&/^[a-zA-Z0-9_-]{1,100}$/.test(x),date=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x);if(d.camp&&(!date(d.camp.start)||!Number.isInteger(d.camp.days)||d.camp.days<1||d.camp.days>365||!(d.camp.hours>=1&&d.camp.hours<=16)))throw Error('campaign');const ids=new Set();for(const s of d.subjects){if(!s||!id(s.id)||ids.has(s.id)||typeof s.name!=='string'||!Number.isFinite(s.pages)||s.pages<0||!Number.isFinite(s.done)||s.done<0||!/^#[0-9a-f]{6}$/i.test(s.color)|| (s.exam&&!date(s.exam))|| (s.lecs&&!Array.isArray(s.lecs)))throw Error('subject');ids.add(s.id)}for(const p of d.plan)if(!p||!ids.has(p.sid)||!date(p.date))throw Error('plan');for(const x of d.sessions)if(!x||!date(x.date)||!Number.isFinite(x.mins)||x.mins<0)throw Error('session');for(const k of ['tasks','mist','grades','arch','exams','cards','rw'])if(d[k]!=null&&!Array.isArray(d[k]))throw Error(k);return d}
function importB(e){const f=e.target.files[0];if(!f)return;if(busy()){alert('أنهِ الجلسة النشطة قبل الاستيراد');return}f.text().then(t=>{try{let raw=JSON.parse(t),d=validateBackup(raw.data||raw),fl=raw.data?raw.files:null;if(fl!=null&&(!Array.isArray(fl)||fl.some(x=>!x||typeof x.id!=='string'||!/^[-\w]+$/.test(x.id)||typeof x.name!=='string'||typeof x.data!=='string'||!x.data.startsWith('data:'))))throw Error('files');ask('سيستبدل الاستيراد بياناتك الحالية. صدّر نسخة أولًا. متابعة؟',async()=>{const old=S;try{S=d;mig();localStorage.setItem(KEY,JSON.stringify(S));if(fl)await restF(fl);tab='today';render()}catch(x){S=old;save();alert('تعذر الاستيراد');render()}})}catch(x){alert('ملف النسخة الاحتياطية غير صالح');render()}})}
function reset(){ask('حذف كل البيانات نهائيا؟',()=>{S={camp:null,subjects:[],plan:[],sessions:[],timer:null};mig();save();render()})}
// ---- views ----
function ring(v,t){const r=62,c=2*Math.PI*r,f=Math.min(1,v/t);return`<svg width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="${v.toFixed(1)} من ${t} ساعة"><circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--line)" stroke-width="14"/><circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--acc)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c*f} ${c}" transform="rotate(-90 80 80)"/><text x="80" y="82" text-anchor="middle" font-size="30" font-weight="700" fill="var(--ink)">${v.toFixed(1)}</text><text x="80" y="106" text-anchor="middle" font-size="13" fill="var(--mut)">من ${t} ساعة</text></svg>`}
function vSetup(){const m=today();

const DB=()=>new Promise((res,rej)=>{const r=indexedDB.open('sf_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});

function dl2(n,o){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download=n;a.click()}
function validQ(q){const e=[];if(!q||typeof q!=='object')return['ليس كائنا'];if(!q.id)e.push('بلا معرف');if(!q.q)e.push('بلا نص');if(!TY.includes(q.type))e.push('نوع غير مدعوم');if(q.type==='mcq'&&(!Array.isArray(q.options)||q.options.length<2))e.push('خيارات ناقصة');if(q.type==='mcq'&&q.answer!=null&&!(Number.isInteger(q.answer)&&q.answer>=0&&q.answer<(q.options||[]).length))e.push('إجابة خارج الخيارات');if(q.type==='tf'&&q.answer!=null&&typeof q.answer!=='boolean')e.push('إجابة TF يجب true/false');if(q.type==='match'&&!(Array.isArray(q.pairs)&&q.pairs.length>1))e.push('أزواج المطابقة ناقصة');return e}
function normQ(q){return{id:String(q.id),type:q.type,q:String(q.q),options:q.options||[],pairs:q.pairs||null,answer:q.answer==null?null:q.answer,exp:q.explanation||'',topic:q.topic||'',lec:q.lecture||'',src:q.source||'',page:q.page||null,diff:q.difficulty||'',ver:q.type==='match'?(['official','confirmed'].includes(q.verification)?'confirmed':'unconfirmed'):q.answer==null?'unknown':(['official','confirmed'].includes(q.verification)?'confirmed':'unconfirmed'),imp:false,hard:false,rep:false}}
function parseQ(t){let d;try{d=JSON.parse(t)}catch(x){return{err:'JSON غير صالح: '+x.message}}const a=Array.isArray(d)?d:d&&d.questions;if(!Array.isArray(a))return{err:'يجب أن يحتوي الملف على مصفوفة questions'};const seen=new Set(),ok=[],bad=[];a.forEach((q,i)=>{const e=validQ(q);if(q&&q.id){if(seen.has(q.id))e.push('معرف مكرر');seen.add(q.id)}e.length?bad.push('سؤال '+(i+1)+': '+e.join('، ')):ok.push(normQ(q))});return{ok,bad}}

function finishRun(){const r=S.run;if(!r||r.done)return;const x=ex(r.eid);const dup=x.att.find(z=>z.rid===r.start);if(dup){r.att=dup.id;r.done=true;save();return render()}const qs=r.ids.map(id=>x.qs.find(q=>q.id===id)).filter(Boolean);let c=0,u=0,ng=0;const wrong=[],G=qs.filter(gradable).length;qs.forEach(q=>{const a=r.ans[q.id];if(!answered(q,a)){u++;return}if(gradable(q)){if(isOk(q,a))c++;else wrong.push(q.id)}else ng++});x.att.push({id:'a'+Date.now(),rid:r.start,man:{},date:today(),mode:r.mode,secs:Math.round((Math.min(Date.now(),r.lim?r.start+r.lim:Date.now())-r.start)/1000),c,u,ng,G,total:qs.length,wrong,ans:r.ans,ids:r.ids});wrong.forEach(id=>{const q=x.qs.find(z=>z.id===id),m=S.mist.find(z=>z.src===(q.from||x.id+':'+id));if(m){m.cnt=(m.cnt||1)+1;m.ok=false;m.ru=addD(today(),1)}});r.att=x.att[x.att.length-1].id;r.done=true;x.last=0;save();render()}

function planEx(eid){const x=ex(eid),o=exSlot(x);if(!o.p||S.plan.some(p=>(p.ex||[]).some(z=>z.eid===eid)))return;ask('دمج «'+x.name+'» في '+o.p.date+' ('+o.m+' دقيقة) ضمن ساعات مادته؟ لن تتغير مادة اليوم.',()=>{(o.p.ex=o.p.ex||[]).push({eid,mins:o.m});save();msg='دُمج الاختبار في الخطة';render()})}

function exPlanCard(sid){const L=S.exams.filter(e=>e.sid===sid&&!e.att.length&&e.qs.length),it=[];S.plan.forEach(p=>(p.ex||[]).forEach(z=>{const e=ex(z.eid);if(e&&e.sid===sid)it.push([p.date,e,z.mins])}));if(!L.length&&!it.length)return'';return`<div class='card'><h2>الاختبارات غير المحلولة والخطة</h2>${it.map(([d,e,m])=>`<div class='day'><span>${esc(e.name)} · ${d} · ${m} د ${e.att.length?'(حُل)':''}</span><button class='k' onclick="unplanEx('${e.id}')">إزالة</button></div>`).join('')}${L.filter(e=>!it.some(i=>i[1].id===e.id)).map(e=>{const o=exSlot(e);return`<div class='day'><span>${esc(e.name)}<br><span class='mut'>${o.p?'مقترح: '+o.p.date+' · '+o.m+' د (يوم دراسة مادته)':'لا يوجد يوم دراسة مناسب قبل اختبار المادة'}</span></span>${o.p?`<button class='g' onclick="planEx('${e.id}')">ادمج</button>`:''}</div>`}).join('')}<p class='mut'>الدمج يحتاج موافقتك، ويستخدم أيام مادة الاختبار نفسها ولا يتجاوز نصف ساعات اليوم. إعادة بناء الخطة تحذف الاختبارات المدمجة فأعد دمجها.</p></div>`}
function exTodayLine(){const t=today(),p=S.plan.find(x=>x.date===t),L=((p&&p.ex)||[]).map(z=>[ex(z.eid),z.mins]).filter(z=>z[0]&&!z[0].att.length),cd=S.cards.filter(cDue).length,md=S.mist.filter(m=>!m.ok&&m.ru&&m.ru<=t).length;return`${L.length?`<p>في خطة اليوم: ${L.map(z=>'حل «'+esc(z[0].name)+'» ('+z[1]+' د)').join('، ')}</p>`:''}${cd||md?`<p class='mut'>بطاقات مستحقة: ${cd} · أخطاء للمراجعة: ${md}</p>`:''}`}

.a)}" placeholder="الصحيحة" onchange="edM('${m.id}','a',this.value)"><input value="${esc(m.exp||'')}" placeholder="الشرح" onchange="edM('${m.id}','exp',this.value)"><select onchange="edM('${m.id}','rsn',this.value)">${RS.map(([k,n])=>`<option value="${k}" ${m.rsn===k?'selected':''}>${n}</option>`).join('')}</select><div class="row"><input value="${esc(m.srcn||'')}" placeholder="المصدر" onchange="edM('${m.id}','srcn',this.value)"><input value="${esc(m.pg||'')}" placeholder="صفحة" onchange="edM('${m.id}','pg',this.value)"></div><input value="${esc(m.lec||'')}" placeholder="المحاضرة" onchange="edM('${m.id}','lec',this.value)"><input value="${esc(m.note||'')}" placeholder="ملاحظاتي" onchange="edM('${m.id}','note',this.value)"><input type="date" value="${m.ru||''}" onchange="edM('${m.id}','ru',this.value)"></details><p class="row"><span class="mut">${(RS.find(r=>r[0]===m.rsn)||[0,'سبب آخر'])[1]}</span><button class="o" style="min-height:40px" onclick="revM('${m.id}')">راجعته</button><button class="g" style="min-height:40px" onclick="togM('${m.id}')">${m.ok?'أعد فتحه':'تم فهمه'}</button><button class="k" style="min-height:40px" onclick="delM('${m.id}')">حذف</button></p></div></div>`).join('')}</div>`}

function cShuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

async function cardImage(id,event){const f=event.target.files[0],c=S.cards.find(x=>x.id===id);if(!f||!c)return;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(f.type)||f.size>10000000)return alert('اختر صورة PNG/JPEG/WebP/GIF أقل من 10 MB');try{const fid='f'+Date.now()+Math.random().toString(36).slice(2,7);await tx('readwrite',o=>o.put({id:fid,name:f.name,type:f.type,size:f.size,cat:'بطاقة',sid:c.sid,lec:c.lec,page:1,date:today(),blob:f}));c.img='local:'+fid;save();await loadF()}catch{alert('تعذر حفظ الصورة')}}

let cardUrls=[];async function hydrateCards(){cardUrls.forEach(URL.revokeObjectURL);cardUrls=[];for(const el of document.querySelectorAll('[data-card-file]')){try{const f=await tx('readonly',o=>o.get(el.dataset.cardFile));if(f?.blob&&el.isConnected){const u=URL.createObjectURL(f.blob);cardUrls.push(u);el.src=u}}catch{}}}

function cParse(t,sid){let d;try{d=JSON.parse(t)}catch(x){return{err:'JSON غير صالح: '+x.message}}const a=Array.isArray(d)?d:d&&d.cards;if(!Array.isArray(a))return{err:'يجب أن يحتوي الملف على مصفوفة cards'};const ok=[],bad=[];a.forEach((c,i)=>{const f=String((c&&(c.front||c.en))||'').trim(),b=String((c&&(c.back||c.ar))||'').trim();if(!f||!b){bad.push('بطاقة '+(i+1)+': ناقصة');return}const s=c.sched||{};ok.push(cMk({sid,type:CTY.some(z=>z[0]===c.type)?c.type:'qa',front:f,back:b,en:c.en||'',ar:c.ar||'',lec:c.lecture||'',topic:c.topic||'',img:cOK(c.image)?c.image:'',src:c.src||'',...(s.due?{due:s.due,iv:+s.iv||0,ease:+s.ease||2.5,reps:+s.reps||0,lapses:+s.lapses||0}:{}),ai:{gen:c.verification!==undefined,model:c.model||'',ver:c.verification||'unknown'}}))});return{ok,bad}}

function cStart(mode){const L=S.cards.filter(c=>!CS||c.sid===CS).filter(mode==='due'?cDue:mode==='new'?cNew:mode==='hard'?cHard:()=>true);let a=L.sort((x,y)=>((sub(x.sid)||{}).exam||'9')>((sub(y.sid)||{}).exam||'9')?1:x.due>y.due?1:-1);if(CSH)a=cShuf(a);a=a.slice(0,mode==='new'?15:200);if(!a.length){msg='لا بطاقات مطابقة';return render()}S.cr={ids:a.map(c=>c.id),i:0,fl:false,log:{},mode,done:false};save();render()}

function achievementStats(data,day){const minutes={};for(const x of data.sessions||[]){if(x.date&&x.date<=day&&Number.isFinite(+x.mins)&&+x.mins>0)minutes[x.date]=(minutes[x.date]||0)+ +x.mins}const dates=Object.keys(minutes).sort(),total=dates.reduce((n,d)=>n+minutes[d],0),tasks=(data.tasks||[]).filter(t=>t.done).length,attempts=(data.exams||[]).reduce((n,e)=>n+(e.att||[]).length,0),cards=(data.cards||[]).filter(c=>c.reps>0).length,mastered=(data.subjects||[]).reduce((n,s)=>n+(s.lecs||[]).filter(l=>l.sg?.length===5&&l.sg.every(Boolean)).length,0);let streak=0,d=minutes[day]>=25?day:addD(day,-1);while(minutes[d]>=25){streak++;d=addD(d,-1)}const xp=Math.floor(total/25)*5+tasks*10+attempts*15+cards*2+mastered*20;return {total,tasks,attempts,cards,mastered,streak,xp,level:1+Math.floor(xp/100)}}
function achievementView(){const a=achievementStats(S,today()),badges=[['البداية',a.total/25],['10 ساعات',a.total/600],['50 ساعة',a.total/3000],['استمرارية 3 أيام',a.streak/3],['استمرارية أسبوع',a.streak/7],['10 مهام',a.tasks/10],['5 اختبارات',a.attempts/5],['20 بطاقة',a.cards/20],['5 محاضرات متقنة',a.mastered/5]];return `<div class="card"><h2>الإنجازات والشارات</h2><p><b>${a.xp} XP · المستوى ${a.level}</b> · الاستمرارية ${a.streak} يوم</p><progress max="100" value="${a.xp%100}" style="width:100%"></progress><p>باقي ${100-a.xp%100} نقطة للمستوى التالي</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px">${badges.map(([n,v])=>`<div class="day"><b>${v>=1?'✓':'○'} ${n}</b><progress max="1" value="${Math.min(1,v)}" style="width:100%"></progress></div>`).join('')}</div><p class="mut">الاستمرارية: 25 دقيقة دراسة مسجلة يوميًا. النقاط مشتقة من السجلات الحالية، وقد تتغير عند تعديلها. لا مكافأة على تجاوز هدف الساعات.</p></div>`}
function breakdownView(data,rows){const dates=new Set(rows.map(r=>r.d)),ss=(data.sessions||[]).filter(x=>dates.has(x.date)&&(!AS||x.sid===AS)&&(!AA||x.act===AA)),total=ss.reduce((n,x)=>n+(+x.mins||0),0),bar=(name,n)=>`<p>${esc(name)} · ${(n/60).toFixed(1)} س</p><progress max="${Math.max(1,total)}" value="${n}" style="width:100%"></progress>`,group=(key)=>{const m=new Map();for(const x of ss)m.set(x[key],(m.get(x[key])||0)+(+x.mins||0));return [...m]};return `<div class="card"><h2>توزيع وقت الدراسة</h2><p>متوسط السجل ${ss.length?(total/ss.length).toFixed(1):'—'} دقيقة (قد تنقسم الجلسة عند منتصف الليل)</p><h3>حسب المادة</h3>${group('sid').map(([k,n])=>bar((data.subjects||[]).find(s=>s.id===k)?.name||'مادة محذوفة',n)).join('')||'لا بيانات'}<h3>حسب النشاط</h3>${group('act').map(([k,n])=>bar(k||'غير محدد',n)).join('')||'لا بيانات'}</div>`}
function vTools(){const x=extras(),r=x.reflection[today()]||{},t=S.timer,opts=S.subjects.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join(''),total=S.sessions.reduce((a,s)=>a+s.mins,0),xp=Math.floor(total/25)*5+S.tasks.filter(t=>t.done).length*10,terms=[...new Set(x.gpa.map(g=>g.term))];return `<h1>أدوات الدراسة</h1><div class="card"><h2>التركيز</h2>${t?`<div id="tclk" style="font-size:48px;text-align:center">${fmt(t.goal?Math.max(0,t.goal-el(t)):el(t))}</div><p>${esc(sub(t.sid)?.name||'')} ${t.goal?' · هدف '+t.goal/60000+' دقيقة':''}</p><button onclick="tPause()">${t.run?'إيقاف مؤقت':'استئناف'}</button> <button onclick="tFinish()">إنهاء وحفظ</button>`:`<select id="xs">${opts}</select><input id="xm" type="number" min="1" value="25"><button onclick="xFocus()">ابدأ جلسة بهدف زمني</button><label>استراحة Pomodoro بالدقائق</label><input id="xb" type="number" min="1" max="60" value="5"><button onclick="xPomo()">ابدأ Pomodoro</button>${pomoView()}`}<p class="mut">المؤقت مشترك مع صفحة اليوم؛ تنتهي الجلسة تلقائيًا عند بلوغ الهدف أثناء تشغيل التطبيق.</p></div>${achievementView()}<div class="card"><h2>التأمل اليومي</h2><label>الطاقة</label><select id="xe">${['low','medium','high'].map((k,i)=>`<option value="${k}" ${r.energy===k?'selected':''}>${['منخفضة','متوسطة','مرتفعة'][i]}</option>`).join('')}</select><label>التركيز 1–5</label><input id="xf" type="number" min="1" max="5" value="${r.focus||3}"><label>ملاحظات اليوم</label><textarea id="xn">${esc(r.note||'')}</textarea><label>خطة الغد</label><textarea id="xt">${esc(r.next||'')}</textarea><button onclick="xReflection()">حفظ</button><p>دراسة اليوم: ${hrs(today()).toFixed(1)} ساعة</p></div><div class="card"><h2>المعدل الجامعي</h2><input id="gn" placeholder="المقرر"><input id="gt" placeholder="الفصل"><input id="gc" type="number" placeholder="الساعات المعتمدة"><input id="gp" type="number" placeholder="النقاط المكتسبة"><input id="gs" type="number" value="5" placeholder="المقياس"><button onclick="xGpa()">إضافة</button><p>المعدل التراكمي المكافئ من 5: ${gpaCalc(x.gpa,5)?.toFixed(2)||'—'}</p>${terms.map(t=>`<p>${esc(t||'بدون فصل')}: ${gpaCalc(x.gpa.filter(g=>g.term===t),5).toFixed(2)} / 5</p>`).join('')}${x.gpa.map((g,i)=>`<div class="day">${esc(g.n)} · ${g.p}/${g.scale} · ${g.c} ساعة <button onclick="extras().gpa.splice(${i},1);xsave()">حذف</button></div>`).join('')}<p class="mut">تحويل خطي للمقاييس المختلفة، وليس معادلة جامعة رسمية.</p></div>${gpaExtraView()}<div class="card"><h2>محاكاة الخطة</h2><input id="xh" type="number" value="${S.camp.hours}"><input id="xd" type="number" value="${S.camp.days}"><button onclick="xSim()">محاكاة دون تعديل</button><div id="xsim"></div></div><div class="card"><h2>الطوارئ</h2><select id="xem"><option value="1">24 ساعة</option><option value="2">48 ساعة</option><option value="3">72 ساعة</option></select><button onclick="xEmergency()">اقتراح</button><div id="xemout"></div></div><div class="card"><h2>البحث الشامل</h2><input id="xq" placeholder="ابحث" oninput="xSearch()"><div id="xr"></div><button onclick="xICS()">تصدير خطة التقويم ICS</button></div><div class="card"><h2>محتوى AI محفوظ محليًا</h2><p>انسخ شرحًا أو ملخصًا من ChatGPT أو Claude واحفظه هنا للمراجعة دون إنترنت. للربط المباشر استخدم تبويب AI بعد إعداد الخادم.</p><input id="xan" placeholder="العنوان"><textarea id="xai" placeholder="الشرح أو الملخص"></textarea><button onclick="xAI()">حفظ</button>${x.aiNotes.map((a,i)=>`<details><summary>${esc(a.n)}</summary><p style="white-space:pre-wrap">${esc(a.t)}</p><button onclick="extras().aiNotes.splice(${i},1);xsave()">حذف</button></details>`).join('')}</div>`}

function aiPrompt(){const mode=val('aimode'),sid=val('aisub'),source=val('aisource').trim(),subj=sub(sid);const tasks={cards:'Create flashcards only from the attached material. Return only JSON with cards array containing front, back, lecture, topic. Use English keywords and Arabic explanations. Do not invent facts.',tutor:'Explain slide by slide: original English verbatim, Arabic translation, Arabic explanation, WHY/HOW and exam cues. Do not invent missing text.',exam:'Extract questions, options and answer keys. Identify repeated questions and topics. Distinguish official answers from inferred answers; mark uncertain items. Return only JSON: {"questions":[{"id":"q1","type":"mcq","q":"question","options":["A","B"],"answer":0,"verification":"ai_suggested","explanation":"reason","topic":"topic","lecture":"lecture","source":"source","page":1}]}. Use zero-based answer indices; use null if unknown.',coach:'Create a realistic study recommendation using the supplied progress. Keep one subject per day, respect deadlines and daily hours. Do not modify the plan.',mock:'Generate practice questions from supplied material only. Mark generated questions and provide answers with explanations; do not claim they are official. Return only JSON with questions array, each containing id, type (mcq), q, options, zero-based answer, explanation, topic, lecture, source, verification (ai_suggested).'};return tasks[mode]+'\nIf the source is not pasted below, ask me to attach the relevant PDF or images in ChatGPT. Do not invent missing material.\nSubject: '+(subj?.name||'')+'\n'+(mode==='coach'?JSON.stringify({hours:S.camp.hours,subjects:S.subjects.map(x=>({name:x.name,pages:x.pages,done:x.done,exam:x.exam})),todayHours:hrs(today())})+'\n':'')+'Source supplied by student:\n'+source}
function aiQuestionJSON(t){let d;try{d=JSON.parse(t.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''))}catch(e){return {err:'الرد ليس JSON صالحًا'}}const a=Array.isArray(d)?d:d?.questions;if(!Array.isArray(a))return {err:'لا توجد مصفوفة questions'};return parseQ(JSON.stringify({questions:a.map(q=>q&&typeof q==='object'?{...q,verification:'ai_suggested'}:q)}))}
function aiImport(){const eid=val('aiExam'),x=ex(eid);if(!x){alert('أنشئ اختبارًا للمادة أولًا');return}if(x.sid!==val('aisub')){alert('اختر اختبارًا من نفس المادة');return}const res=aiQuestionJSON(val('airesult'));if(res.err||!res.ok?.length){alert(res.err||'لا توجد أسئلة صالحة');return}if(!confirm('معاينة '+res.ok.length+' سؤال صالح و'+res.bad.length+' غير صالح. جميع الإجابات غير مؤكدة حتى تراجعها. متابعة؟'))return;IM={eid,res};XS=x.sid;tab='ex';render()}
function aiBuild(){document.getElementById('aiprompt').value=aiPrompt()}
async function aiCopy(){aiBuild();try{await navigator.clipboard.writeText(val('aiprompt'));alert('تم النسخ')}catch(e){document.getElementById('aiprompt').select();alert('انسخ النص المحدد يدويًا')}}
function aiSave(){const t=val('airesult').trim();if(!t)return;extras().aiNotes.push({n:val('aimode')+' — '+(sub(val('aisub'))?.name||''),t,date:today()});xsave()}
function aiOpen(){aiBuild();window.open('https://chatgpt.com/','_blank','noopener,noreferrer')}
function aiCards(){const sid=val('aisub');if(!sub(sid))return alert('اختر المادة');const t=val('airesult').trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');let d;try{d=JSON.parse(t)}catch{return alert('الرد ليس JSON صالحًا')}if(!Array.isArray(d.cards))return alert('لا توجد مصفوفة cards');const res=cParse(JSON.stringify({cards:d.cards.filter(c=>c&&typeof c.front==='string'&&typeof c.back==='string').map(c=>({front:c.front,back:c.back,lecture:String(c.lecture||''),topic:String(c.topic||''),verification:'ai_suggested',model:'ChatGPT'}))}),sid);if(!res.ok?.length)return alert('لا توجد بطاقات صالحة');if(confirm('استيراد '+res.ok.length+' بطاقة مقترحة؟ راجع محتواها قبل الاعتماد عليه.'))cPush(res.ok)}
function vAI(){return `<h1>مساعد الدراسة AI</h1><div class="card"><p>نسخة بدون تكلفة إضافية: جهّز الطلب وانسخه، ثم افتح ChatGPT بحسابك الحالي. ارفع الملف هناك وألصق الرد هنا. لا يوجد API أو إرسال تلقائي.</p><label>الأداة</label><select id="aimode"><option value="tutor">المدرس الخصوصي</option><option value="exam">تحليل الاختبارات</option><option value="coach">المدرب الدراسي</option><option value="mock">اختبار تجريبي</option><option value="cards">بطاقات تعليمية</option></select><label>المادة</label><select id="aisub">${S.subjects.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select><label>النص أو محتوى المحاضرة</label><textarea id="aisource"></textarea><p class="mut">للملفات: ارفع PDF أو الصور داخل ChatGPT بنفسك. راجع الطلب قبل نسخه، خصوصًا بيانات التقدم.</p><button onclick="aiBuild()">تجهيز الطلب</button> <button onclick="aiCopy()">نسخ الطلب</button> <button onclick="aiOpen()">فتح ChatGPT</button><textarea id="aiprompt" readonly></textarea><label>ألصق الإجابة للمراجعة دون نت</label><textarea id="airesult"></textarea><button onclick="aiSave()">حفظ الإجابة</button> <button onclick="aiCards()">استيراد بطاقات AI</button><label>استيراد أسئلة AI إلى اختبار موجود</label><select id="aiExam">${S.exams.map(x=>`<option value="${esc(x.id)}">${esc((sub(x.sid)?.name||'')+' — '+x.name)}</option>`).join('')}</select><button onclick="aiImport()">معاينة الأسئلة قبل الاستيراد</button></div><div class="card"><h2>المحتوى المحفوظ</h2>${extras().aiNotes.map((a,i)=>`<details><summary>${esc(a.n)} · ${esc(a.date)}</summary><p style="white-space:pre-wrap">${esc(a.t)}</p><button onclick="extras().aiNotes.splice(${i},1);xsave()">حذف</button></details>`).join('')}</div>`}
function applyTheme(){const t=extras().theme||"auto";if(t==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;document.getElementById("themeBtn").textContent="المظهر: "+({auto:"تلقائي",light:"فاتح",dark:"داكن"}[t]||"تلقائي")}
function cycleTheme(){const a=["auto","light","dark"];extras().theme=a[(a.indexOf(extras().theme||"auto")+1)%3];save();applyTheme()}
function render(){applyTheme();const nv=document.getElementById('nav');
 if(!S.camp||P){nv.style.display='none';app.innerHTML=vSetup();return}
 nv.style.display='flex';const T=[['today','اليوم'],['subs','المواد'],['tasks','المهام'],['cal','التقويم'],['plan','الخطة'],['lib','الملفات'],['ex','الاختبارات'],['cards','البطاقات'],['analytics','التحليلات'],['tools','أدوات'],['ai','AI'],['more','المزيد']];
 nv.innerHTML=T.map(([k,l])=>`<button class="${tab===k?'on':''}" aria-current="${tab===k?'page':'false'}" onclick="tab='${k}';msg='';k2('${k}')">${l}</button>`).join('');
 app.innerHTML={today:vToday,subs:vSubs2,tasks:vTasks,cal:vCal,lib:vLib,ex:vEx,cards:vCards,plan:vPlan,analytics:vAnalytics,tools:vTools,ai:vAI,more:vMore2}[tab]();msg='';updUI();hydrateCards()}
let UPD=null;
function busy(){return !!(S.timer||(S.run&&!S.run.done)||(S.cr&&!S.cr.done))}
function updUI(){const u=document.getElementById('upd');if(!u)return;if(!UPD){u.style.display='none';return}u.style.display='block';u.innerHTML=busy()?'يوجد تحديث جديد. أنهِ جلسة المذاكرة أو الاختبار أولا ثم طبّقه.':'يوجد تحديث جديد. <button class="p" onclick="applyUpd()">طبّقه الآن</button>'}
function applyUpd(){if(busy()||!UPD)return;save();window.__ap=1;UPD.postMessage('SKIP')}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(r=>{const w=()=>{if(r.waiting&&navigator.serviceWorker.controller){UPD=r.waiting;updUI()}};w();r.addEventListener('updatefound',()=>{const n=r.installing;n&&n.addEventListener('statechange',w)});r.update().catch(()=>{});setInterval(()=>{r.update().catch(()=>{});updUI()},60000)}).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(window.__ap&&!window.__r){window.__r=1;location.reload()}})}
render();
</script>
